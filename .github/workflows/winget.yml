name: Publish to WinGet

on:
  release:
    types: []
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version Tag (e.g. v0.4.1)'
        required: false
        default: 'v0.4.1'

jobs:
  publish:
    name: Submit to Windows Package Manager
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 for WingetCreate
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download Microsoft WingetCreate CLI
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe" -OutFile "$env:TEMP\wingetcreate.exe"
          New-Item -ItemType Directory -Path "$env:USERPROFILE\bin" -Force | Out-Null
          Move-Item "$env:TEMP\wingetcreate.exe" -Destination "$env:USERPROFILE\bin\wingetcreate.exe" -Force
          echo "$env:USERPROFILE\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run Publish Script
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $tag = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } elseif ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME.StartsWith("v")) { $env:GITHUB_REF_NAME } else { "v0.4.1" }
          & .github/scripts/publish-winget.ps1 -Tag $tag -Token $env:GITHUB_TOKEN
