name: Publish Legacy WinGet Update (ismlEraslan.EmailSummarizer)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version Tag (e.g. v0.5.0 or v0.5.0-bridge)'
        required: false
        default: 'v0.5.0'

jobs:
  publish-legacy:
    name: Submit Update to ismlEraslan.EmailSummarizer
    runs-on: windows-latest
    # Only run for pre-release / bridge tags (e.g. v0.5.0, v0.5.0-bridge) or manual dispatch
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'v0.5') || contains(github.ref_name, 'bridge')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 for WingetCreate
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download Microsoft WingetCreate CLI
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe" -OutFile "$env:TEMP\wingetcreate.exe"
          New-Item -ItemType Directory -Path "$env:USERPROFILE\bin" -Force | Out-Null
          Move-Item "$env:TEMP\wingetcreate.exe" -Destination "$env:USERPROFILE\bin\wingetcreate.exe" -Force
          echo "$env:USERPROFILE\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run Legacy Publish Script
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $tag = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } elseif ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME.StartsWith("v")) { $env:GITHUB_REF_NAME } else { "v0.5.0" }
          & .github/scripts/publish-winget-legacy.ps1 -Tag $tag -Token $env:GITHUB_TOKEN
