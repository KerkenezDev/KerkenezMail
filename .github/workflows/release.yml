name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0 or v0.5.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compile Single-File Executable
        run: |
          dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

      - name: Package Release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/KerkenezMail.exe -DestinationPath ./publish/KerkenezMail.zip -Force

      - name: Determine Prerelease Status
        id: check_pre
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          $isPre = $tag.Contains("0.5") -or $tag.Contains("beta") -or $tag.Contains("rc") -or $tag.Contains("bridge")
          "is_prerelease=$($isPre.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "release_tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release & Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_pre.outputs.release_tag }}
          files: |
            ./publish/KerkenezMail.zip
            ./publish/KerkenezMail.exe
          name: Release ${{ steps.check_pre.outputs.release_tag }}
          draft: false
          prerelease: ${{ steps.check_pre.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
